[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clause-agent"
version = "0.1.0"
description = "A self-correcting LangGraph agent that answers contract questions with verified citations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0",
  "numpy>=1.24",
  "clausewise @ git+https://github.com/saundaryaverma/Clausewise.git",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
clause-agent = "clause_agent.cli:main"

[tool.setuptools]
packages = ["clause_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["clause_agent"]
omit = ["clause_agent/__main__.py"]
